<script>
  (function() {
    const bottomSheet = document.getElementById('bottom-sheet');
    const backdrop = document.getElementById('backdrop');
    const closeBtn = document.getElementById('close-btn');
    const cancelBtn = document.getElementById('cancel-pill-btn');
    const scanCard = document.getElementById('card-scan');
    const searchCard = document.getElementById('card-search');
    const manualBtn = document.getElementById('btn-manual');

    function dismissSheet() {
      if (!bottomSheet) return;
      bottomSheet.classList.add('translate-y-full');
      backdrop.classList.add('opacity-0');
      setTimeout(() => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          bottomSheet.classList.remove('translate-y-full');
          backdrop.classList.remove('opacity-0');
        }
      }, 220);
    }

    if (closeBtn) closeBtn.addEventListener('click', dismissSheet);
    if (cancelBtn) cancelBtn.addEventListener('click', dismissSheet);
    if (backdrop) backdrop.addEventListener('click', dismissSheet);

    function flashSelection(btn, destinationHint) {
      btn.classList.add('scale-[0.98]');
      setTimeout(() => {
        btn.classList.remove('scale-[0.98]');
      }, 150);
    }

    if (scanCard) scanCard.addEventListener('click', () => flashSelection(scanCard, 'Scanner'));
    if (searchCard) searchCard.addEventListener('click', () => flashSelection(searchCard, 'Search'));
    if (manualBtn) manualBtn.addEventListener('click', () => flashSelection(manualBtn, 'Manual Form'));
  })();
</script></main></body></html>
