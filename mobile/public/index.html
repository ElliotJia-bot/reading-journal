<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Remarked</title>
    <meta
      name="description"
      content="Keep your books close. Track your reading, discover your rhythm, and find your reading circle."
    />
    <meta name="theme-color" content="#fcfaf7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Remarked" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/remarked-v15-apple-touch.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/remarked-v15-favicon.png" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        background: #fcfaf7;
      }
      body {
        margin: 0;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        flex: 1;
        height: 100%;
      }
      input,
      textarea {
        font-size: 16px;
      }
      :focus-visible {
        outline: 2px solid #356c55;
        outline-offset: 3px;
      }

      /* V1.7 state colors. Color values mirror src/lib/theme.ts. */
      :root {
        --remarked-green: #003422;
        --remarked-hover: #164a36;
        --remarked-pressed: #00291b;
        --remarked-ink: #4b3c35;
        --remarked-on-dark: #fffdfa;
        --remarked-soft-hover: #e4ede6;
        --remarked-soft-pressed: #cfdfd4;
        --remarked-disabled: #e9e2d9;
        --remarked-muted: #6d5e55;
        --remarked-focus: #356c55;
        --remarked-stone: #d9cfc3;
      }
      input:hover:not(:disabled), textarea:hover:not(:disabled), select:hover:not(:disabled) {
        border-color: var(--remarked-stone);
      }
      input:focus, textarea:focus, select:focus {
        border-color: var(--remarked-green);
        caret-color: var(--remarked-green);
      }
      input:disabled, textarea:disabled, select:disabled {
        background-color: var(--remarked-disabled);
        color: var(--remarked-muted);
      }
      input::file-selector-button {
        background-color: #eef4ef;
        border-color: var(--remarked-stone);
        color: var(--remarked-green);
      }
      [data-testid="theme-primary"]:hover:not([aria-disabled="true"]),
      [data-testid="theme-chip"][aria-selected="true"]:hover:not([aria-disabled="true"]) {
        background-color: var(--remarked-hover) !important;
      }
      [data-testid="theme-primary"]:hover:not([aria-disabled="true"]) stop {
        stop-color: var(--remarked-hover);
      }
      [data-testid="theme-primary"]:active:not([aria-disabled="true"]),
      [data-testid="theme-chip"][aria-selected="true"]:active:not([aria-disabled="true"]) {
        background-color: var(--remarked-pressed) !important;
      }
      [data-testid="theme-primary"]:active:not([aria-disabled="true"]) stop {
        stop-color: var(--remarked-pressed);
      }
      [data-testid="theme-secondary"]:hover:not([aria-disabled="true"]),
      [data-testid="theme-chip"]:not([aria-selected="true"]):hover {
        background-color: var(--remarked-soft-hover) !important;
      }
      [data-testid="theme-secondary"]:active:not([aria-disabled="true"]),
      [data-testid="theme-chip"]:not([aria-selected="true"]):active {
        background-color: var(--remarked-soft-pressed) !important;
      }
      [data-testid^="theme-"][aria-disabled="true"] {
        background-color: var(--remarked-disabled) !important;
      }
      [data-testid^="theme-"][aria-disabled="true"] stop {
        stop-color: var(--remarked-disabled);
      }
      [data-testid^="theme-"][aria-disabled="true"] * {
        color: var(--remarked-ink) !important;
      }
      [data-testid^="theme-"]:focus-visible, :focus-visible {
        outline-color: var(--remarked-focus);
      }
    </style>
  </head>
  <body>
    <noscript>Please enable JavaScript to open your Remarked.</noscript>
    <div id="root"></div>
  </body>
</html>
